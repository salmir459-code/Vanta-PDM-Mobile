<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vanta PDM</title>
<meta name="theme-color" content="#0E1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8; --s1:#FFFFFF; --s2:#EFF1F4; --s3:#E4E7EC;
  --border:#DDE1E6; --borderb:#BFC5CE;
  --text:#161A1F; --muted:#5A6270; --dim:#8A929E;
  --accent:#CC2200;
  --accent-t:color-mix(in srgb,var(--accent) 86%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --ok:#1F8B3E; --warn:#8A6400; --err:#D32F2F;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1013; --s1:#14171C; --s2:#1A1E24; --s3:#22272F;
    --border:#2A3039; --borderb:#3A424E;
    --text:#E8EAED; --muted:#8F97A3; --dim:#6E7683;
    --accent-t:color-mix(in srgb,var(--accent) 68%,#fff);
    --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
    --ok:#3DD68C; --warn:#F5B544; --err:#F2555A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1013; --s1:#14171C; --s2:#1A1E24; --s3:#22272F;
  --border:#2A3039; --borderb:#3A424E;
  --text:#E8EAED; --muted:#8F97A3; --dim:#6E7683;
  --accent-t:color-mix(in srgb,var(--accent) 68%,#fff);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --ok:#3DD68C; --warn:#F5B544; --err:#F2555A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-t)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}

.app{max-width:600px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--border)}
header.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;border-radius:10px;color:var(--accent-t)}
.back:active{background:var(--accent-soft)}
.hbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:var(--muted)}
.hbtn:active{background:var(--s2)}
.brand{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}

main{padding:16px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h2 span{font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:500}
.sec>h2 button{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:13px;color:var(--accent-t);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-size:18px;font-weight:500;margin-top:2px;white-space:nowrap}
.kpi .v u{text-decoration:none;font-size:12px;color:var(--muted);margin-left:2px}

.list{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);width:100%;text-align:left}
.list>.row:first-child,.list>:first-child .row:first-child{border-top:0}
button.row:active{background:var(--s2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t.wrap{white-space:normal;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.row .r{text-align:right;flex:none}
.row .r .num{display:block;font-size:14px}
.row .r small{display:block;font-size:12px;color:var(--muted)}
.row .chev{color:var(--dim)}
.row .ic{color:var(--muted)}
.row .ic.pdf{color:var(--accent-t)}
.row.dim{opacity:.55}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent-t)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--s3);color:var(--muted);white-space:nowrap}
.pill.aktiv{background:var(--accent-soft);color:var(--accent-t)}
.empty{padding:14px;color:var(--muted);font-size:14px}
.loading{padding:14px;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:17px}
.phead .nr{font-family:var(--mono);font-size:13px;color:var(--accent-t)}
.phead h3{margin:2px 0 0;font-size:20px;line-height:1.25;text-wrap:balance}
.phead .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.stats div{background:var(--s2);padding:9px 11px;min-width:0}
.stats small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stats .num{font-size:16px}
.desc{white-space:pre-wrap;font-size:14px;max-width:65ch}
.path{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.path .p{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-word}
.path .loc{font-weight:600;font-size:13px}
.path.drive .loc{color:var(--ok)}
.path.pc .loc{color:var(--warn)}

.task{border-top:1px solid var(--border)}
.task:first-child{border-top:0}
.task>button{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;text-align:left}
.task>button .main{flex:1;min-width:0}
.task>button .t{font-weight:600}
.task>button .m{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task>button>svg{transition:transform .15s;color:var(--dim)}
.task.open>button>svg{transform:rotate(90deg)}
.entries{display:none;padding:0 14px 10px}
.task.open>.entries{display:block}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:8px 0;border-top:1px dashed var(--border);font-size:14px}
.entry .d{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.entry .c{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.entry .h{font-family:var(--mono);text-align:right}
.entry .vb{grid-column:2/4;font-family:var(--mono);font-size:12px;color:var(--dim)}
.openp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent-t);padding:8px 0 2px}

.kgroup{display:flex;flex-direction:column;gap:8px}
.khead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 2px 0}
.khead b{font-size:16px}
.khead span{font-family:var(--mono);font-size:13px;color:var(--muted)}

.kalk .pos{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 14px;border-top:1px solid var(--border);font-size:14px}
.kalk .pos:first-child{border-top:0}
.kalk .pos .q{font-family:var(--mono);font-size:12px;color:var(--muted)}
.kalk .pos .s{font-family:var(--mono);text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.kalk .sum{display:flex;justify-content:space-between;padding:11px 14px;background:var(--s2);border-top:1px solid var(--borderb);font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--s1);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.m{font-family:var(--mono)}

.bars{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:34px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.bar .l{color:var(--muted)}
.bar .track{height:12px;border-radius:3px;background:var(--s2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar .v{font-family:var(--mono);text-align:right}
.bar.zero .v{color:var(--dim)}

.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:10px 0;outline:none;min-width:0}

.note{font-size:13px;color:var(--muted);max-width:65ch;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:var(--s1);color:var(--text);border:1px solid var(--border)}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{color:var(--accent-t);font-weight:600;font-size:14px}
.banner{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.banner .main{flex:1;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.sw i{width:24px;height:24px;border-radius:50%;display:block}
.sw.on{border-color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500;border-radius:10px}
nav.tabs button.on{color:var(--accent-t)}

/* Sheet (Ordnerauswahl) */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ohead{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.ohead h2{flex:1;min-width:0;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohead h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.obody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ofoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--bg)}
.crumbs{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* PDF-Reader */
.pv{position:fixed;inset:0;z-index:30;background:#1D2025;display:flex;flex-direction:column;color:#E8EAED}
.pv .ohead{background:#14171C;border-color:#2A3039;color:#E8EAED}
.pv .ohead h2 small{color:#8F97A3}
.pv .hbtn{color:#C9CED6}
.pv .hbtn:active{background:#2A3039}
.pvs{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:contain}
.pvin{width:max-content;min-width:100%;padding:8px 0 24px;transform-origin:0 0}
.pg{background:#fff;margin:8px auto;box-shadow:0 1px 4px rgba(0,0,0,.4);position:relative}
.pg canvas{display:block;width:100%;height:100%;position:relative;z-index:1}
.pg .pn{position:absolute;top:50%;left:0;right:0;text-align:center;color:#9AA2AE;font-family:var(--mono);font-size:13px;transform:translateY(-50%)}
.pvbar{display:flex;align-items:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:#14171C;border-top:1px solid #2A3039}
.pvbar .pc{flex:1;text-align:center;font-family:var(--mono);font-size:13px;color:#C9CED6}
.pvmsg{margin:auto;padding:24px;text-align:center;max-width:36ch;display:flex;flex-direction:column;gap:12px;align-items:center;color:#C9CED6}
.pvmsg a{color:#FF8A73}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#22272F;color:#E8EAED;padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* Formulare */
.fgrid{display:grid;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--text);background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.frow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fcalc{background:var(--s2);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.ferr{color:var(--err);font-size:14px;font-weight:600}
.fhint{font-size:13px;color:var(--muted)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.danger.on{background:var(--err);color:#fff}
.kpos{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px;display:grid;gap:8px}
.kpos .kh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.kpos .frow{grid-template-columns:1fr 1fr 1.2fr}
.pend{color:var(--warn)!important}
button.entry{width:100%;text-align:left}
button.entry:active{background:var(--s2)}
.hbtn.acc{color:var(--accent-t)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet" class="overlay" hidden></div>
<div id="form" class="overlay" hidden></div>
<div id="pv" class="pv" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

const FOLDER='application/vnd.google-apps.folder';
const ACCENTS={rot:'#CC2200',korall:'#E05A47',orange:'#D2691E',gold:'#C9A227',smaragd:'#1A6B3C',petrol:'#0F7A70',stahlblau:'#1560BD',azur:'#0A84FF',indigo:'#5A4FCF',violett:'#7B3FBF',graphit:'#6E7681'};

  kunden:'<path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/>',

async function onToken(r){

class AuthErr extends Error{}
async function api(path,params={},opt={}){
  if(!tokenValid())throw new AuthErr('auth');
  const url=(opt.upload?'https://www.googleapis.com/upload/drive/v3/':'https://www.googleapis.com/drive/v3/')+path+'?'+new URLSearchParams(params);
  const res=await fetch(url,{method:opt.method||'GET',headers:Object.assign({Authorization:'Bearer '+AUTH.token},opt.headers||{}),body:opt.body});
  if(res.status===401){AUTH.token='';LS.set('vanta_auth',AUTH);throw new AuthErr('auth')}
  if(!res.ok){let m=res.status+'';try{m=(await res.json()).error.message}catch(e){}throw new Error(m)}
  if(opt.raw)return res;
  return res.status===204?null:res.json();
}
const SHARED={supportsAllDrives:'true',includeItemsFromAllDrives:'true'};
async function listChildren(id){
  let out=[],token='';
  do{
    const p=Object.assign({q:`'${id}' in parents and trashed=false`,fields:'nextPageToken,files(id,name,mimeType,size,modifiedTime,shortcutDetails)',pageSize:'500',orderBy:'folder,name_natural'},SHARED);
    if(token)p.pageToken=token;
    const r=await api('files',p);out=out.concat(r.files||[]);token=r.nextPageToken||'';
  }while(token);
  return out.map(f=>f.mimeType==='application/vnd.google-apps.shortcut'&&f.shortcutDetails?Object.assign({},f,{id:f.shortcutDetails.targetId,mimeType:f.shortcutDetails.targetMimeType,shortcut:true}):f);
}
const qEsc=s=>s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function findChild(parent,name,folderOnly){
  const p=Object.assign({q:`'${parent}' in parents and name='${qEsc(name)}' and trashed=false`+(folderOnly?` and mimeType='${FOLDER}'`:''),fields:'files(id,name)',pageSize:'5'},SHARED);
  const r=await api('files',p);return (r.files||[])[0]||null;
}
// Windows-Pfad (G:/Meine Ablage/…) → Kette von Drive-Ordnern; so weit, wie gefunden
async function resolvePath(p){
  const m=/^[A-Z]:\/(?:Meine Ablage|My Drive)\/(.+)$/i.exec(String(p||'').replace(/\\/g,'/'));
  const chain=[{id:'root',name:'Meine Ablage'}];
  if(!m)return chain;
  let parent='root';
  for(const part of m[1].split('/').filter(Boolean)){
    try{const f=await findChild(parent,part,true);if(!f)break;chain.push({id:f.id,name:f.name});parent=f.id}catch(e){if(e instanceof AuthErr)throw e;break}
  }
  return chain;
}
async function download(id,onProgress){
  const res=await api('files/'+encodeURIComponent(id),Object.assign({alt:'media'},{supportsAllDrives:'true'}),{raw:true});
  if(!res.body||!onProgress)return res.arrayBuffer();
  const reader=res.body.getReader();const chunks=[];let n=0;
  for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);n+=value.length;onProgress(n)}
  const buf=new Uint8Array(n);let o=0;for(const c of chunks){buf.set(c,o);o+=c.length}
  return buf.buffer;
}

// Einstellungen: versteckter App-Ordner auf deinem Drive (nur diese App sieht ihn)
async function loadRemoteSettings(){
  try{
    const r=await api('files',{spaces:'appDataFolder',q:`name='${CFG.settingsName}'`,fields:'files(id)'});
    const f=(r.files||[])[0];
    if(!f){remoteSettingsId=null;if(SET.dataFileId||Object.keys(SET.links).length)saveSettings();return}
    remoteSettingsId=f.id;
    const txt=new TextDecoder().decode(await download(f.id));
    const o=JSON.parse(txt);
    SET=Object.assign(SET,o,{links:Object.assign({},o.links||{})});
    LS.set('vanta_settings',SET);applyTheme();
  }catch(e){if(e instanceof AuthErr)throw e;console.warn('Einstellungen',e)}
}
let saveT;
function saveSettings(){
  LS.set('vanta_settings',SET);
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!tokenValid())return;
    const body=JSON.stringify(SET);
    try{
      if(remoteSettingsId){
        await api('files/'+remoteSettingsId,{uploadType:'media'},{upload:true,method:'PATCH',headers:{'Content-Type':'application/json'},body});
      }else{

        const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
        const r=await api('files',{uploadType:'multipart',fields:'id'},{upload:true,method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi});
        remoteSettingsId=r.id;
      }

let loadingData=false;

    if(m.trashed)throw new Error('Die Datei liegt im Papierkorb.');

// ════════════ Änderungen vom Handy ════════════
// Das Handy schreibt NIE in pdm_projects.json. Jede Änderung wird ein Auftrag
// in mobile_changes.json (neben pdm_projects.json). Der PC arbeitet sie ein
// und vermerkt die Nummern in pdm_projects.json unter „mobil_uebernommen“.
const newId=()=>{const a=new Uint8Array(4);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase()};
const opId=()=>'M'+new Date().toISOString().replace(/\D/g,'').slice(0,14)+'-'+newId();
function appliedSet(){const s=new Set(((DATA&&DATA.mobil_uebernommen)||[]).map(String));((DATA&&DATA.mobil_konflikte)||[]).forEach(k=>k&&s.add(String(k.op_id)));return s}
function pendingOps(){const a=appliedSet();return OPS.filter(o=>!a.has(String(o.op_id)))}
function pruneOps(){const a=appliedSet(),n=OPS.length;OPS=OPS.filter(o=>!a.has(String(o.op_id)));if(OPS.length!==n){OPS_DIRTY=true;LS.set('vanta_ops',OPS);LS.set('vanta_ops_dirty',true)}}
function stundenAus(von,bis,pause){
  const m1=/^(\d{1,2}):(\d{2})$/.exec(von||''),m2=/^(\d{1,2}):(\d{2})$/.exec(bis||'');
  if(!m1||!m2)return null;
  let min=(+m2[1]*60+ +m2[2])-(+m1[1]*60+ +m1[2])-(+pause||0);if(min<0)min+=1440;
  return Math.round(min/60*100)/100;
}
function vFind(v,kid,pid,tid,eid){
  const r={};r.k=(v.kunden||[]).find(k=>String(k.id)===String(kid));
  if(pid!=null){for(const k of [r.k,...(v.kunden||[])].filter(Boolean)){const p=(k.projekte||[]).find(p=>String(p.id)===String(pid));if(p){r.k=k;r.p=p;break}}}
  if(r.p&&tid!=null)r.t=(r.p.tasks||[]).find(t=>String(t.id)===String(tid));
  if(r.t&&eid!=null)r.e=(r.t.zeiteintraege||[]).find(e=>String(e.id)===String(eid));
  return r;
}
// Dieselben Regeln wie mobil_sync.py am PC, nur ohne Konfliktprüfung (Anzeige)
function applyOp(v,o){
  const f=vFind(v,o.kunde_id,o.projekt_id,o.task_id,o.eintrag_id);
  switch(o.typ){
    case 'kunde_neu':if(!vFind(v,o.kunde.id).k)(v.kunden=v.kunden||[]).push(Object.assign({projekte:[]},o.kunde,{_m:1}));break;
    case 'kunde_aendern':if(f.k)Object.assign(f.k,o.neu,{_m:1});break;
    case 'projekt_neu':if(f.k&&!vFind(v,null,o.projekt.id).p)(f.k.projekte=f.k.projekte||[]).push(Object.assign({tasks:[],zahlungen:[]},o.projekt,{_m:1}));break;
    case 'projekt_aendern':if(f.p)Object.assign(f.p,o.neu,{_m:1});break;
    case 'task_neu':if(f.p&&!(f.p.tasks||[]).some(t=>t.id===o.task.id))(f.p.tasks=f.p.tasks||[]).push(Object.assign({zeiteintraege:[]},o.task,{_m:1}));break;
    case 'task_aendern':if(f.t)Object.assign(f.t,o.neu,{_m:1});break;
    case 'kalkulation_setzen':if(f.p)f.p.kalkulation={stand:new Date().toLocaleDateString('de-AT'),positionen:JSON.parse(JSON.stringify(o.positionen)),_m:1};break;
    case 'zeit_neu':if(f.t&&!(f.t.zeiteintraege||[]).some(e=>e.id===o.eintrag.id))(f.t.zeiteintraege=f.t.zeiteintraege||[]).push(Object.assign({},o.eintrag,{_m:1}));break;
    case 'zeit_aendern':if(f.e){Object.assign(f.e,o.neu,{_m:1});const h=f.e.von&&f.e.bis&&f.e.von!==f.e.bis?stundenAus(f.e.von,f.e.bis,f.e.pause_min):null;if(h!=null)f.e.stunden=h}break;
    case 'zeit_loeschen':if(f.t&&f.e)f.t.zeiteintraege=f.t.zeiteintraege.filter(e=>e!==f.e);break;
  }
}
function rebuildView(){
  if(!DATA){VIEW=null;return}
  VIEW=JSON.parse(JSON.stringify(DATA));
  pendingOps().slice().sort((a,b)=>String(a.zeit).localeCompare(String(b.zeit))).forEach(o=>{try{applyOp(VIEW,o)}catch(e){console.warn('Änderung',o,e)}});
}
function addOps(list){
  const now=Date.now();
  list.forEach((o,i)=>{o.op_id=opId();o.zeit=new Date(now+i).toISOString();o.quelle='handy';OPS.push(o)});
  OPS_DIRTY=true;LS.set('vanta_ops',OPS);LS.set('vanta_ops_dirty',true);
  rebuildView();render();
  if(tokenValid())syncOps();else toast('Auf dem Handy gespeichert. Hochgeladen wird, sobald du angemeldet bist.');
}
let syncing=false,syncAgain=false;
async function syncOps(){
  if(!tokenValid()||!SET.dataParentId)return;
  if(syncing){syncAgain=true;return}
  syncing=true;
  try{
    let remote=[];
    if(!SET.changesId){
      const r=await api('files',Object.assign({q:`'${SET.dataParentId}' in parents and name='${CFG.changesName}' and trashed=false`,fields:'files(id)',pageSize:'5'},SHARED));
      if(r.files&&r.files[0]){SET.changesId=r.files[0].id;saveSettings()}
    }
    if(SET.changesId){
      try{const o=JSON.parse(new TextDecoder().decode(await download(SET.changesId)));remote=Array.isArray(o.ops)?o.ops:[]}
      catch(e){if(e instanceof AuthErr)throw e;if(/not found/i.test(e.message)){SET.changesId='';saveSettings()}}
    }
    const a=appliedSet(),map=new Map();
    [...remote,...OPS].forEach(o=>{if(o&&o.op_id&&!a.has(String(o.op_id)))map.set(o.op_id,o)});
    const merged=[...map.values()].sort((x,y)=>String(x.zeit).localeCompare(String(y.zeit)));
    const same=remote.length===merged.length&&remote.every((o,i)=>o.op_id===merged[i].op_id);
    if(!same||!SET.changesId){
      if(!merged.length&&!SET.changesId){/* nichts zu tun */}
      else{
        const body=JSON.stringify({version:1,hinweis:'Geschrieben von Vanta PDM Mobil. Bitte nicht von Hand ändern.',geaendert:new Date().toISOString(),ops:merged},null,1);
        if(SET.changesId){
          await api('files/'+SET.changesId,{uploadType:'media'},{upload:true,method:'PATCH',headers:{'Content-Type':'application/json'},body});
        }else{
          const b='vanta'+Math.random().toString(36).slice(2);
          const meta=JSON.stringify({name:CFG.changesName,parents:[SET.dataParentId],mimeType:'application/json'});
          const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
          const r=await api('files',Object.assign({uploadType:'multipart',fields:'id'},{supportsAllDrives:'true'}),{upload:true,method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:multi});
          SET.changesId=r.id;saveSettings();
        }
      }
    }
    OPS=merged;OPS_DIRTY=false;LS.set('vanta_ops',OPS);LS.set('vanta_ops_dirty',false);
    rebuildView();
  }catch(e){
    OPS_DIRTY=true;LS.set('vanta_ops_dirty',true);
    if(e instanceof AuthErr)toast('Anmeldung abgelaufen. Deine Einträge bleiben auf dem Handy, bis du dich neu anmeldest.');
    else if(/insufficient|permission|scope/i.test(e.message))toast('Die App darf noch nicht speichern. Bitte abmelden, neu anmelden und alle Häkchen setzen.');
    else toast('Hochladen fehlgeschlagen: '+e.message+'. Die Einträge bleiben auf dem Handy.');
  }finally{
    syncing=false;render();
    if(syncAgain){syncAgain=false;syncOps()}
  }
}

const K=()=>(VIEW&&VIEW.kunden)||[];
function projHours(p){let h=0;(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>h+=+z.stunden||0));return h}
function projMenge(p){let v=0;(p.tasks||[]).forEach(t=>{if(t.art==='menge'&&!t.in_pauschale)v+=(+t.menge||0)*(+t.vk||0)});return v}
function projValue(p,k){if(p.abrechnungstyp==='pauschal')return +p.pauschalpreis||0;return projHours(p)*(+p.stundensatz||+k.stundensatz||0)+projMenge(p)}
function projPaid(p){return (p.zahlungen||[]).reduce((a,z)=>a+(+z.betrag||0),0)}
const isActive=s=>s==='aktiv'||s==='laufend';
function lastDate(p){let d=0;(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>{const x=pd(z.datum);if(x&&+x>d)d=+x}));return d}
const pkey=(k,p)=>p.id||('x:'+k.name+'|'+(p.nummer||'')+'|'+one(p.name));
function allEntries(){
  const out=[];
  K().forEach((k,ki)=>(k.projekte||[]).forEach((p,pi)=>(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>{const d=pd(z.datum);if(d)out.push({z,t,p,k,ki,pi,d})}))));
  return out.sort((a,b)=>b.d-a.d||String(b.z.von).localeCompare(String(a.z.von)));
}
function allPayments(){
  const out=[];
  K().forEach((k,ki)=>(k.projekte||[]).forEach((p,pi)=>(p.zahlungen||[]).forEach(z=>{const d=pd(z.datum);if(d)out.push({z,p,k,ki,pi,d})})));
  return out.sort((a,b)=>b.d-a.d);
}
function pathInfo(s){
  if(!s)return null;
  const n=String(s).replace(/\\/g,'/');
  const m=/^[A-Z]:\/((?:Meine Ablage|My Drive)\/.*)$/i.exec(n);
  if(m&&/^[GH]:/i.test(n))return {cls:'drive',loc:'Google Drive',p:m[1]};
  if(/^C:\/Users\/[^/]+\/Downloads/i.test(n))return {cls:'pc',loc:'Nur am PC (Downloads)',p:n};
  return {cls:'pc',loc:'Nur am PC',p:n};
}

let tab='start', stack=[{v:'start'}];
const ui={openTasks:new Set(),zeitOpen:{},umsatzJahr:null,zeitQ:'',kundenQ:'',zeitPer:'alle'};
const TABS=[['start','Start','haus'],['kunden','Kunden','kunden'],['zeiten','Zeiten','zeit'],['umsatz','Umsatz','umsatz'],['einstellungen','Einstellungen','zahnrad']];
function push(){history.pushState({vanta:1},'')}
function go(v){stack.push(v);push();render(true)}
function uiBack(){history.back()}
window.addEventListener('popstate',()=>{
  if(ignorePops>0){ignorePops--;return}
  if(!document.getElementById('pv').hidden){closePdf();return}
  if(!document.getElementById('sheet').hidden){sheetBack();return}
  if(!document.getElementById('form').hidden){formHide();return}
  if(stack.length>1){stack.pop();render(true)}
});
function setTab(t){tab=t;stack=[{v:t}];render(true)}

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" class="${tab===k?'on':''}" aria-label="${l}">${ic(i)}<span>${l==='Einstellungen'?'Einstell.':l}</span></button>`).join('');
}
function header(title,sub,right){
  const b=stack.length>1?`<button class="back" data-act="back" aria-label="Zurück">${ic('back')}</button>`:'';
  const brand=stack.length===1&&tab==='start'?`<span class="brand">V</span>`:'';
  document.getElementById('top').innerHTML=`${b}${brand}<h1>${sub?`<span class="sub">${esc(sub)}</span>`:''}${esc(title)}</h1>${right||''}`;
}
const hBtn=(act,icon,label)=>`<button class="hbtn acc" data-act="${act}" aria-label="${label}">${ic(icon,'s')}</button>`;

function vStart(){
  header('Vanta PDM','Mobil',refreshBtn());
  if(!DATA)return welcome();
  const now=new Date(),ents=allEntries();
  const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  let hw=0,hm=0;ents.forEach(e=>{if(e.d>=monday)hw+=+e.z.stunden||0;if(e.d.getFullYear()===now.getFullYear()&&e.d.getMonth()===now.getMonth())hm+=+e.z.stunden||0});
  const uj=allPayments().filter(x=>x.d.getFullYear()===now.getFullYear()).reduce((a,x)=>a+(+x.z.betrag||0),0);
  const act=[];K().forEach((k,ki)=>(k.projekte||[]).forEach((p,pi)=>{if(isActive(p.status))act.push({k,p,ki,pi,l:lastDate(p)})}));
  act.sort((a,b)=>b.l-a.l);
  return `${authBanner()}${pendingBanner()}<div class="kpis">
    <div class="kpi"><small>Woche</small><div class="v">${h1(hw)}<u>h</u></div></div>
    <div class="kpi"><small>${MON[now.getMonth()]}</small><div class="v">${h1(hm)}<u>h</u></div></div>
    <div class="kpi"><small>Umsatz</small><div class="v">${eur0(uj).replace(' €','')}<u>€</u></div></div>
  </div>

  <section class="sec"><h2>Aktive Projekte <span>${act.length}</span></h2>

}

// ── Zeiten: nach Kunde → Projekt ──
function periodRange(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  switch(ui.zeitPer){
    case 'monat':return [new Date(y,m,1),new Date(y,m+1,1)];
    case 'vormonat':return [new Date(y,m-1,1),new Date(y,m,1)];
    case 'jahr':return [new Date(y,0,1),new Date(y+1,0,1)];
    default:return [null,null];
  }
}
function vZeiten(){
  header('Zeiten','',(DATA?hBtn('newzeit','plus','Zeit erfassen'):'')+refreshBtn());
  if(!DATA)return welcome();
  const [from,to]=periodRange(),q=ui.zeitQ.toLowerCase();
  const kunden=[];let total=0;
  K().forEach((k,ki)=>{
    const projs=[];
    (k.projekte||[]).forEach((p,pi)=>{
      const es=[];
      (p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>{
        const d=pd(z.datum);if(!d)return;
        if(from&&(d<from||d>=to))return;
        if(q&&!((z.kommentar||'')+' '+t.name+' '+one(p.name)+' '+(p.nummer||'')+' '+k.name).toLowerCase().includes(q))return;
        es.push({z,t,d});
      }));
      if(!es.length)return;
      es.sort((a,b)=>b.d-a.d||String(b.z.von).localeCompare(String(a.z.von)));
      const h=es.reduce((s,e)=>s+(+e.z.stunden||0),0);
      projs.push({p,pi,es,h,last:+es[0].d,act:isActive(p.status)});
    });
    if(!projs.length)return;
    projs.sort((a,b)=>(b.act-a.act)||(b.last-a.last));
    const h=projs.reduce((s,x)=>s+x.h,0);total+=h;
    kunden.push({k,ki,projs,h,last:Math.max(...projs.map(x=>x.last))});
  });
  kunden.sort((a,b)=>b.last-a.last);
  const per=[['alle','Alle'],['monat','Dieser Monat'],['vormonat','Letzter Monat'],['jahr','Dieses Jahr']];
  return `<div class="chips">${per.map(([k,l])=>`<button class="chip ${ui.zeitPer===k?'on':''}" data-per="${k}">${l}</button>`).join('')}</div>
  <label class="search">${ic('suchen','s')}<input id="zq" type="search" placeholder="Kommentar, Projekt oder Kunde" value="${esc(ui.zeitQ)}" autocomplete="off"></label>
  <div class="kv" style="margin:0 2px"><span>Summe im Zeitraum</span><span class="num"><b>${hrs(total)}</b></span></div>
  ${kunden.map(g=>`<section class="kgroup"><div class="khead"><b>${esc(g.k.name)}</b><span>${hrs(g.h)}</span></div>
    <div class="list">${g.projs.map(x=>{
      const key=pkey(g.k,x.p);
      const open=key in ui.zeitOpen?ui.zeitOpen[key]:(x.act||!!q);
      return `<div class="task ${open?'open':''}"><button data-zeit-toggle="${esc(key)}" aria-expanded="${open}">
        <div class="main"><div class="t">${esc(one(x.p.name))}</div><div class="m"><span class="tag">${esc(x.p.nummer||'—')}</span><span>${x.es.length} Eintr${x.es.length===1?'ag':'äge'}</span>${x.act?'<span class="pill aktiv">aktiv</span>':''}</div></div>

function viewHtml(){
  const s=stack[stack.length-1];
  const tabs={start:vStart,kunden:vKunden,zeiten:vZeiten,umsatz:vUmsatz,einstellungen:vEinstellungen};
  if(tabs[s.v])return tabs[s.v]();
  const k=K()[s.ki];
  if(s.v==='kunde'&&k)return vKunde(s.ki);
  if(s.v==='projekt'&&k&&(k.projekte||[])[s.pi])return vProjekt(s.ki,s.pi);
  if(s.v==='ordner')return vOrdner(s);
  stack=[{v:tab}];return tabs[tab]();   // Eintrag existiert nach Neuladen nicht mehr
}
function render(scrollTop){
  renderTabs();

  catch(e){console.error(e);html=`<div class="card"><b>Die Daten konnten nicht angezeigt werden.</b><p class="note">${esc(e.message)}. Wähle unter „Einstellungen“ eine gültige pdm_projects.json.</p></div>`}

}

// Ordnerinhalt (Zeichnungen) nachladen
const folderCache={};
async function fillFolder(el){
  const id=el.dataset.folder;
  const draw=items=>{
    const folders=items.filter(f=>f.mimeType===FOLDER);
    const pdfs=items.filter(f=>f.mimeType==='application/pdf'||/\.pdf$/i.test(f.name));
    const other=items.length-folders.length-pdfs.length;
    el.innerHTML=folders.map(f=>`<button class="row" data-go="ordner" data-fid="${esc(f.id)}" data-fname="${esc(f.name)}">${ic('ordner','s ic')}<div class="main"><div class="t">${esc(f.name)}</div></div>${ic('chev','s chev')}</button>`).join('')
      +pdfs.map(f=>`<button class="row" data-pdf="${esc(f.id)}" data-name="${esc(f.name)}">${ic('dokument','s ic pdf')}<div class="main"><div class="t wrap">${esc(f.name.replace(/\.pdf$/i,''))}</div><div class="m"><span class="mono">${f.modifiedTime?esc(new Date(f.modifiedTime).toLocaleDateString('de-AT')):''}</span><span class="mono">${f.size?fmtSize(f.size):''}</span></div></div></button>`).join('')
      +(other>0?`<div class="empty">${other} weitere Datei${other===1?'':'en'} (keine PDF)</div>`:'')
      +(!items.length?'<div class="empty">Dieser Ordner ist leer.</div>':'');
  };
  const c=folderCache[id];
  if(c&&Date.now()-c.t<120000){draw(c.items);return}
  if(!tokenValid()){
    el.innerHTML=`<div class="row"><div class="main"><div class="t">Anmeldung nötig</div><div class="m">Zum Anzeigen der Zeichnungen bei Google anmelden.</div></div><button class="btn small" data-act="login">Anmelden</button></div>`;return;
  }
  el.innerHTML='<div class="loading"><span class="spin"></span>Lade Ordner …</div>';
  try{
    const items=await listChildren(id);folderCache[id]={t:Date.now(),items};
    if(el.isConnected)draw(items);
  }catch(e){
    if(!el.isConnected)return;
    if(e instanceof AuthErr){el.innerHTML=`<div class="row"><div class="main"><div class="t">Anmeldung abgelaufen</div></div><button class="btn small" data-act="login">Anmelden</button></div>`;return}
    const gone=/not found|File not found/i.test(e.message);
    el.innerHTML=`<div class="row"><div class="main"><div class="t">${gone?'Ordner nicht gefunden':'Ordner konnte nicht geladen werden'}</div><div class="m">${gone?'Er wurde gelöscht oder du hast keinen Zugriff mehr. Bitte neu verknüpfen.':esc(e.message)}</div></div>${el.dataset.key?`<button class="btn small" data-act="linkfolder" data-key="${esc(el.dataset.key)}">Neu verknüpfen</button>`:''}</div>`;
  }
}

let SH=null; // {mode:'link'|'data', key, chain:[{id,name}], items, loading, err}
function projectByKey(key){for(const k of K())for(const p of (k.projekte||[]))if(pkey(k,p)===key)return {k,p};return null}
async function openSheet(mode,key){
  if(!tokenValid()){needLogin(()=>openSheet(mode,key));return}
  SH={mode,key,chain:[{id:'root',name:'Meine Ablage'}],items:null,loading:true,depth:1};
  document.getElementById('sheet').hidden=false;push();drawSheet();
  try{
    if(mode==='link'){
      const pr=projectByKey(key),cur=SET.links[key];
      if(pr&&pr.p.ordner&&pathInfo(pr.p.ordner).cls==='drive')SH.chain=await resolvePath(pr.p.ordner);
      else if(cur)SH.chain=[{id:'root',name:'Meine Ablage'}];
    }else if(mode==='data'&&SET.dataFileId){
      // beim bisherigen Ordner starten
      try{const m=await api('files/'+SET.dataFileId,{fields:'parents',supportsAllDrives:'true'});if(m.parents&&m.parents[0]){const pm=await api('files/'+m.parents[0],{fields:'id,name',supportsAllDrives:'true'});SH.chain.push({id:pm.id,name:pm.name})}}catch(e){}
    }
  }catch(e){if(e instanceof AuthErr){closeSheet();needLogin(()=>openSheet(mode,key));return}}
  if(!SH)return;
  while(SH.depth<SH.chain.length){push();SH.depth++}   // je Ordnerebene ein Zurück-Schritt
  await loadSheet();
}
async function loadSheet(){
  const cur=SH.chain[SH.chain.length-1];SH.loading=true;SH.err=null;drawSheet();
  try{SH.items=await listChildren(cur.id)}catch(e){SH.items=[];SH.err=e instanceof AuthErr?'Anmeldung abgelaufen. Schließe das Fenster und melde dich neu an.':e.message}
  SH.loading=false;drawSheet();
}
function drawSheet(){
  const el=document.getElementById('sheet');if(!SH)return;
  const cur=SH.chain[SH.chain.length-1];
  const pr=SH.mode==='link'?projectByKey(SH.key):null;
  const title=SH.mode==='link'?'Zeichnungsordner wählen':'Datendatei wählen';
  const sub=SH.mode==='link'&&pr?(pr.p.nummer||one(pr.p.name)):'Google Drive';
  let body='';
  if(SH.loading)body='<div class="list"><div class="loading"><span class="spin"></span>Lade …</div></div>';
  else if(SH.err)body=`<div class="list"><div class="empty">${esc(SH.err)}</div></div>`;
  else{
    const items=SH.items||[];
    const folders=items.filter(f=>f.mimeType===FOLDER);
    const files=SH.mode==='data'?items.filter(f=>/\.json$/i.test(f.name)):items.filter(f=>f.mimeType==='application/pdf'||/\.pdf$/i.test(f.name));
    body=`<div class="list">${folders.map(f=>`<button class="row" data-sh-open="${esc(f.id)}" data-name="${esc(f.name)}">${ic('ordner','s ic')}<div class="main"><div class="t">${esc(f.name)}</div></div>${ic('chev','s chev')}</button>`).join('')}
      ${SH.mode==='data'?files.map(f=>`<button class="row" data-sh-file="${esc(f.id)}" data-name="${esc(f.name)}">${ic('dokument','s ic pdf')}<div class="main"><div class="t">${esc(f.name)}</div><div class="m"><span class="mono">${f.modifiedTime?esc(fmtWhen(f.modifiedTime)):''}</span></div></div></button>`).join('')
        :files.map(f=>`<div class="row dim">${ic('dokument','s ic')}<div class="main"><div class="t">${esc(f.name)}</div></div></div>`).join('')}
      ${!folders.length&&!files.length?`<div class="empty">${SH.mode==='data'?'Keine Unterordner oder JSON-Dateien hier.':'Keine Unterordner oder PDFs hier.'}</div>`:''}</div>`;
    if(SH.mode==='link')body=`<p class="note">${files.length} PDF${files.length===1?'':'s'} in diesem Ordner.</p>`+body;
  }
  el.innerHTML=`<div class="ohead"><button class="hbtn" data-act="sheetback" aria-label="Zurück">${ic(SH.chain.length>1?'back':'close')}</button><h2><small>${esc(sub)}</small>${esc(title)}</h2>${SH.chain.length>1?`<button class="hbtn" data-act="sheetclose" aria-label="Schließen">${ic('close','s')}</button>`:''}</div>
    <div class="obody"><div class="crumbs">${SH.chain.map(c=>esc(c.name)).join(' / ')}</div>${body}</div>
    ${SH.mode==='link'?`<div class="ofoot"><button class="btn" data-act="sheetpick" ${SH.loading||cur.id==='root'?'disabled':''}>${ic('link','s')}„${esc(cur.name)}“ verknüpfen</button></div>`:''}`;
}
function sheetBack(){ // wird von popstate aufgerufen (Zurück-Taste oder Pfeil)
  if(!SH)return;
  SH.depth--;
  if(SH.chain.length>1&&SH.depth>0){SH.chain.pop();loadSheet()}
  else{document.getElementById('sheet').hidden=true;SH=null}
}
let ignorePops=0;
function closeSheet(){ // schließt komplett und räumt die Zurück-Schritte weg
  const n=SH?SH.depth:0;document.getElementById('sheet').hidden=true;SH=null;
  if(n>0){ignorePops++;history.go(-n)}
}


// ════════════ Formulare (Eingabe am Handy) ════════════
let FM=null;
const pad2=n=>String(n).padStart(2,'0');
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const deToIso=s=>{const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s||'');return m?`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`:isoToday()};
const isoToDe=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?`${m[3]}.${m[2]}.${m[1]}`:''};
const numIn=v=>{let t=String(v??'').trim().replace(/\s|€/g,'');if(!t)return 0;if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');const n=parseFloat(t.replace(',','.'));return isFinite(n)?n:0};
const numOut=v=>{const n=+v||0;return String(Math.round(n*1000)/1000).replace('.',',')};
const hm=min=>{min=((min%1440)+1440)%1440;return pad2(Math.floor(min/60))+':'+pad2(min%60)};
const isHourTask=t=>!t.art||t.art==='stunden';
function ctxFromStack(){const s=stack[stack.length-1];return s.v==='projekt'?{ki:s.ki,pi:s.pi}:s.v==='kunde'?{ki:s.ki}:{}}
function projectChoices(){
  const out=[];K().forEach((k,ki)=>(k.projekte||[]).forEach((p,pi)=>out.push({ki,pi,k,p,act:isActive(p.status),l:lastDate(p)})));
  return out.sort((a,b)=>(b.act-a.act)||(b.l-a.l));
}
function openForm(kind,ctx){
  if(!VIEW){toast('Zuerst die Datendatei laden (Einstellungen).');return}
  if(!SET.dataParentId){toast('Bitte unter Einstellungen einmal „Neu laden“ tippen, dann kann gespeichert werden.');return}
  FM={kind,ctx:Object.assign({},ctx||{}),v:{},err:'',del:false};
  const v=FM.v;
  if(kind==='zeit'){
    if(FM.ctx.ki==null){const c=projectChoices()[0];if(!c){toast('Noch kein Projekt vorhanden.');return}FM.chooser=true;v.proj=c.ki+':'+c.pi}
    else v.proj=FM.ctx.ki+':'+FM.ctx.pi;
    const e=FM.ctx.eid?zeitRef().e:null;
    if(FM.ctx.eid&&!e){toast('Eintrag nicht gefunden.');return}
    if(e){
      FM.old=JSON.parse(JSON.stringify(e));
      v.task=FM.ctx.tid;v.datum=deToIso(e.datum);v.komm=e.kommentar||'';
      if(e.von&&e.bis&&e.von!==e.bis){v.mode='vb';v.von=e.von;v.bis=e.bis;v.pause=e.pause_min||0}
      else{v.mode='dauer';const m=Math.round((+e.stunden||0)*60);v.dh=Math.floor(m/60);v.dm=m%60;v.von='';v.bis='';v.pause=0}
    }else{
      const now=new Date(),m=Math.round((now.getHours()*60+now.getMinutes())/15)*15;
      Object.assign(v,{datum:isoToday(),mode:'vb',von:hm(m-60),bis:hm(m),pause:0,dh:1,dm:0,komm:''});
      v.task=defaultTask();
    }
  }else if(kind==='kunde'){
    const k=FM.ctx.ki!=null?K()[FM.ctx.ki]:null;FM.old=k?{name:k.name,stundensatz:k.stundensatz}:null;
    Object.assign(v,{name:k?k.name:'',satz:numOut(k?k.stundensatz:50)});
  }else if(kind==='projekt'){
    const k=K()[FM.ctx.ki],p=FM.ctx.pi!=null?k.projekte[FM.ctx.pi]:null;
    FM.old=p?JSON.parse(JSON.stringify(p)):null;
    Object.assign(v,{name:p?one(p.name):'',nummer:p?p.nummer||'':'',status:p?p.status||'aktiv':'aktiv',abr:p?p.abrechnungstyp||'stundensatz':'stundensatz',
      pausch:numOut(p?p.pauschalpreis:0),satz:numOut(p?(+p.stundensatz||+k.stundensatz||0):(+k.stundensatz||0)),beschr:p?p.beschreibung||'':''});
  }else if(kind==='kalk'){
    const p=K()[FM.ctx.ki].projekte[FM.ctx.pi];
    const pos=((p.kalkulation&&p.kalkulation.positionen)||[]);

let PV=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('PDF-Reader konnte nicht geladen werden (Internet?).'));document.head.appendChild(s)})}

function loadPdfJs(){

const MAXPX=12e6; // Grenze pro Seite (iPhone erlaubt max. ~16,7 Mio. Pixel je Canvas)
function pvShell(name,inner,bar){
  const el=document.getElementById('pv');
  el.innerHTML=`<div class="ohead"><button class="hbtn" data-act="pvclose" aria-label="Schließen">${ic('close')}</button><h2><small>Zeichnung</small>${esc(name)}</h2>${PV&&PV.id?`<a class="hbtn" href="https://drive.google.com/file/d/${encodeURIComponent(PV.id)}/view" target="_blank" rel="noopener" aria-label="In Google Drive öffnen">${ic('extern','s')}</a>`:''}</div>${inner}${bar||''}`;
}
async function openPdf(id,name){
  if(!tokenValid()){needLogin(()=>openPdf(id,name));return}
  PV={id,name,z:1,pages:[],gen:0};
  const el=document.getElementById('pv');el.hidden=false;push();document.body.style.overflow='hidden';
  const msg=t=>pvShell(name,`<div class="pvs" style="display:flex"><div class="pvmsg"><span class="spin"></span><div>${t}</div></div></div>`);
  msg('Lade Zeichnung …');
  try{
    const [buf]=await Promise.all([download(id,n=>{if(PV&&PV.id===id)msg('Lade Zeichnung … '+fmtSize(n))}),loadPdfJs()]);
    if(!PV||PV.id!==id)return;

    buildViewer();

    if(!PV)return;
    const auth=e instanceof AuthErr;
    pvShell(name,`<div class="pvs" style="display:flex"><div class="pvmsg"><b>${auth?'Anmeldung abgelaufen':'Die Zeichnung konnte nicht geöffnet werden.'}</b><div>${auth?'Schließe den Reader und melde dich neu an.':esc(e.message)}</div><a href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view" target="_blank" rel="noopener">In Google Drive öffnen</a></div></div>`);

function buildViewer(){

   `<div class="pvbar"><button class="hbtn" data-act="zout" aria-label="Verkleinern">${ic('minus','s')}</button><button class="hbtn" data-act="zin" aria-label="Vergrößern">${ic('plus','s')}</button><span class="pc" id="pvpc">1 / ${PV.pages.length}</span><button class="hbtn" data-act="zfit" aria-label="Auf Breite">${ic('breite','s')}</button></div>`);

function pageScale(i){const cw=PV.sc.clientWidth-16;return cw/PV.pages[i].w*PV.z}

  const p=PV.pages[i],css=pageScale(i),dpr=window.devicePixelRatio||1;

    if(!moved&&e.changedTouches.length===1&&e.touches.length===0){
      const now=Date.now();
      if(now-lastTap<300){
        const r=sc.getBoundingClientRect(),t=e.changedTouches[0];
        setZoom(PV.z>1.2?1:2.5,t.clientX-r.left,t.clientY-r.top);lastTap=0;
      }else lastTap=now;
    }
  });
  sc.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();const r=sc.getBoundingClientRect();setZoom(PV.z*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
}
function closePdf(){
  const el=document.getElementById('pv');el.hidden=true;el.innerHTML='';document.body.style.overflow='';
  if(PV){if(PV.io)PV.io.disconnect();if(PV.doc)PV.doc.destroy();PV=null}
}

// ════════════ Ereignisse ════════════
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){setTab(d.tab);return}
  switch(d.act){
    case 'back':uiBack();return;
    case 'login':signIn();return;
    case 'logout':signOut();return;
    case 'reload':if(!tokenValid())needLogin(()=>loadData());else loadData();return;
    case 'pickdata':openSheet('data');return;
    case 'linkfolder':openSheet('link',d.key);return;
    case 'unlink':delete SET.links[d.key];saveSettings();render();toast('Verknüpfung gelöst.');return;
    case 'wipe':['vanta_data','vanta_meta','vanta_settings','vanta_auth'].forEach(LS.del);DATA=null;META={};AUTH={};SET={dataFileId:'',dataFileName:'',links:{},theme:'system',accent:'rot'};applyTheme();stack=[{v:tab}];render();toast('Daten von diesem Handy gelöscht. Deine Dateien auf Drive sind unverändert.');return;
    case 'sheetback':uiBack();return;
    case 'sheetclose':closeSheet();return;
    case 'sheetpick':{
      const cur=SH.chain[SH.chain.length-1];
      SET.links[SH.key]={id:cur.id,name:cur.name,path:SH.chain.slice(1).map(c=>c.name).join('/')};
      delete folderCache[cur.id];saveSettings();closeSheet();setTimeout(render,50);toast('Ordner verknüpft.');return;
    }
    case 'pvclose':uiBack();return;
    case 'fcancel':formClose();return;
    case 'fsave':formSave();return;
    case 'fdel':formDelete();return;
    case 'kadd':FM.rows.push({orig:{},text:'',menge:'1',einheit:'Stk',preis:'0',art:'sonstiges'});drawForm();setTimeout(()=>{const l=document.querySelectorAll('#form [data-kf="text"]');if(l.length)l[l.length-1].focus()},30);return;
    case 'newzeit':openForm('zeit',ctxFromStack().pi!=null?ctxFromStack():{});return;
    case 'newkunde':openForm('kunde',{});return;
    case 'editkunde':openForm('kunde',{ki:ctxFromStack().ki});return;
    case 'newprojekt':openForm('projekt',{ki:ctxFromStack().ki});return;
    case 'editprojekt':openForm('projekt',ctxFromStack());return;
    case 'editkalk':openForm('kalk',ctxFromStack());return;
    case 'syncnow':if(!tokenValid())needLogin(()=>syncOps());else syncOps();return;
    case 'zin':setZoom(PV.z*1.5);return;
    case 'zout':setZoom(PV.z/1.5);return;
    case 'zfit':setZoom(1);return;
  }
  if(d.fmode){FM.v.mode=d.fmode;drawForm();return}
  if(d.fabr){FM.v.abr=d.fabr;drawForm();return}
  if(d.kdel!=null&&FM){FM.rows.splice(+d.kdel,1);drawForm();return}
  if(d.ez){const [ki,pi,tid,eid]=d.ez.split('|');openForm('zeit',{ki:+ki,pi:+pi,tid,eid});return}
  if(d.shOpen){SH.chain.push({id:d.shOpen,name:d.name});SH.depth++;push();loadSheet();return}
  if(d.shFile){SET.dataFileId=d.shFile;SET.dataFileName=d.name;saveSettings();closeSheet();setTimeout(()=>loadData(),50);return}
  if(d.pdf){openPdf(d.pdf,d.name);return}
  if(d.per){ui.zeitPer=d.per;render();return}
  if(d.jahr){ui.umsatzJahr=d.jahr==='alle'?'alle':+d.jahr;render(true);return}
  if(d.themeSet){SET.theme=d.themeSet;applyTheme();saveSettings();render();return}
  if(d.accent){SET.accent=d.accent;applyTheme();saveSettings();render();return}
  if(d.taskToggle){const k=d.taskToggle;ui.openTasks.has(k)?ui.openTasks.delete(k):ui.openTasks.add(k);b.parentElement.classList.toggle('open');b.setAttribute('aria-expanded',ui.openTasks.has(k));return}
  if(d.zeitToggle){const k=d.zeitToggle,open=!b.parentElement.classList.contains('open');ui.zeitOpen[k]=open;b.parentElement.classList.toggle('open',open);b.setAttribute('aria-expanded',open);return}
  if(d.go){
    if(d.go==='ordner'){const cur=stack[stack.length-1];go({v:'ordner',fid:d.fid,name:d.fname,title:cur.v==='projekt'?(K()[cur.ki].projekte[cur.pi].nummer||'Zeichnungen'):cur.name});return}
    if(d.task)ui.openTasks.add(d.task);
    go({v:d.go,ki:+d.ki,pi:+d.pi});
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.closest('#form')){formInput(ev.target);return}
  const id=ev.target.id;if(id!=='zq'&&id!=='kq')return;
  if(id==='zq')ui.zeitQ=ev.target.value;else ui.kundenQ=ev.target.value;
  const pos=ev.target.selectionStart;render();
  const el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}
});
window.addEventListener('resize',()=>{if(PV&&PV.els){layout();PV.pages.forEach(p=>{p.px=p.px?-1:0});visibleRerender()}});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tokenValid()&&SET.dataFileId&&Date.now()-(META.loadedAt||0)>300000)loadData(true)});

history.replaceState({vanta:0},'');
rebuildView();
render();
if(tokenValid()){loadRemoteSettings().then(()=>{if(SET.dataFileId&&Date.now()-(META.loadedAt||0)>300000)return loadData(true);if(OPS_DIRTY)return syncOps()}).then(()=>render()).catch(()=>{})}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
