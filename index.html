<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vanta PDM Mobil</title>
<meta name="theme-color" content="#2F5D3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vanta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F6F4; --s1:#FFFFFF; --s2:#EEF3EF; --s3:#E2E9E3;
  --border:#D5DAD6; --borderb:#B9C2BB;
  --text:#1A1C1A; --muted:#5F6660; --dim:#8E968F;
  --acc:#2F5D3A; --acc-t:#2F5D3A; --acc-soft:rgba(47,93,58,.10); --on-acc:#fff;
  --ok:#2F7A3E; --warn:#8A6400; --info:#1F5FA8; --err:#B0352B;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0F1310; --s1:#161B17; --s2:#1C221D; --s3:#242C25;
    --border:#2B342D; --borderb:#3A463C;
    --text:#E7ECE8; --muted:#97A29A; --dim:#6F7B72;
    --acc:#4E8A5E; --acc-t:#86C496; --acc-soft:rgba(110,180,128,.14); --on-acc:#fff;
    --ok:#6CCB86; --warn:#E9B04A; --info:#79AEF0; --err:#F0857A;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px}
.bar h1{font-family:var(--cond);font-size:20px;font-weight:600;letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ib{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:var(--acc-t)}
.ib:active{background:var(--acc-soft)}
.back{margin-left:-8px}
.logo{width:30px;height:30px;flex:none}
.st{display:flex;align-items:center;gap:8px;padding:6px 16px 8px;font-size:13px;min-height:30px}
.st .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.st.ok .tx{color:var(--ok)} .st.up .tx{color:var(--info)} .st.down .tx{color:var(--info)}
.st.warn .tx{color:var(--warn)} .st.busy .tx{color:var(--muted)} .st.err .tx{color:var(--err)}
.st button.k{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid currentColor;color:var(--acc-t);white-space:nowrap}
.spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--acc-t);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

main{padding:14px 16px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h2 .a{font-size:13px;letter-spacing:0;text-transform:none;color:var(--acc-t);font-weight:600}
.sec>h2 .n{letter-spacing:0;text-transform:none;font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-family:var(--cond);font-size:21px;font-weight:600;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .v u{text-decoration:none;font-size:13px;color:var(--muted);margin-left:2px;font-weight:500}

.list{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);width:100%;text-align:left}
.row:first-child{border-top:0}
button.row:active{background:var(--s2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .r{text-align:right;flex:none}
.row .r .num{display:block;font-size:14.5px;font-weight:500}
.row .r small{display:block;font-size:12px;color:var(--muted)}
.chev{color:var(--dim)}
.tag{font-family:var(--cond);font-size:13px;font-weight:600;color:var(--acc-t);letter-spacing:.02em}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--s3);color:var(--muted);white-space:nowrap}
.pill.aktiv{background:var(--acc-soft);color:var(--acc-t)}
.pill.anfrage{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.pill.abgebrochen,.pill.ueberfaellig{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
.pill.pausiert,.pill.offen{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.eigen{color:var(--muted);background:transparent;border:1px solid var(--border)}
.pill.bezahlt{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.wait{color:var(--info);font-weight:700;font-size:13px}
.empty{padding:14px;color:var(--muted);font-size:14px}

.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.phead .nr{font-family:var(--cond);font-size:14px;font-weight:600;color:var(--acc-t)}
.phead h3{margin:2px 0 0;font-family:var(--cond);font-size:22px;font-weight:600;line-height:1.2;text-wrap:balance}
.phead .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.stats div{background:var(--s2);padding:9px 11px}
.stats small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stats .num{font-size:16px;font-weight:500}
.desc{white-space:pre-wrap;font-size:14px;max-width:65ch}
.note{font-size:13px;color:var(--muted);max-width:65ch;margin:0}
.path{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);word-break:break-word}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;background:var(--acc);color:var(--on-acc);font-weight:600}
.btn.ghost{background:var(--s1);color:var(--acc-t);border:1px solid var(--border)}
.btn.small{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{background:var(--s1);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,var(--border))}
.btn:disabled{opacity:.5}

.task{border-top:1px solid var(--border)}
.task:first-child{border-top:0}
.task>button{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;text-align:left}
.task>button .main{flex:1;min-width:0}
.task>button .t{font-weight:600}
.task>button svg{transition:transform .15s;color:var(--dim)}
.task.open>button svg{transform:rotate(90deg)}
.entries{display:none;padding:0 14px 12px}
.task.open .entries{display:block}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:9px 0;border-top:1px dashed var(--border);font-size:14px;width:100%;text-align:left}
.entry .d{font-size:12.5px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.entry .c{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.entry .h{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.entry .vb{grid-column:2/4;font-size:12px;color:var(--dim)}
.entries .add{margin-top:8px}

.kalk .pos{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 14px;border-top:1px solid var(--border);font-size:14px}
.kalk .pos:first-child{border-top:0}
.kalk .pos .q{font-size:12.5px;color:var(--muted)}
.kalk .pos .s{text-align:right;grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums}
.kalk .sum{display:flex;justify-content:space-between;padding:11px 14px;background:var(--s2);border-top:1px solid var(--borderb);font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--s1);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.bars{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.barr{display:grid;grid-template-columns:34px 1fr 76px;gap:10px;align-items:center;font-size:13px}
.barr .l{color:var(--muted)}
.barr .track{height:12px;border-radius:3px;background:var(--s2);overflow:hidden}
.barr .fill{height:100%;background:var(--acc);border-radius:3px}
.barr .v{text-align:right;font-variant-numeric:tabular-nums}
.barr.zero .v{color:var(--dim)}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;min-width:0}
.month{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px 0}

.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;
  background:var(--acc);color:var(--on-acc);font-weight:600;padding:13px 18px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500;border-radius:10px;position:relative}
nav.tabs button.on{color:var(--acc-t)}
nav.tabs button .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--info)}

/* Formular-Blatt */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--borderb);margin:6px auto 10px}
.sheet h3{font-family:var(--cond);font-size:20px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--s1));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--border));border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.errbox{color:var(--err);font-size:14px;margin-bottom:10px}
.sheet .actions{display:flex;gap:8px;margin-top:6px}
.sheet .actions .btn{flex:1}
.ftyp{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--s2);color:var(--muted)}
.ftyp.ordner{background:var(--acc-soft);color:var(--acc-t)}
.ftyp.pdf{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
.ftyp.bild{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info)}
.ftyp.cad{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.dk{display:flex;flex-wrap:wrap;gap:8px}
.dk .btn{flex:1 1 auto}
.krumen{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;margin:-6px 2px 0}
.viewer{background:var(--s2);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.viewer canvas,.viewer img{display:block;margin:0 auto 8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.vbar{display:flex;align-items:center;gap:8px}
.vbar .z{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:46px;text-align:center}
.vbar .sp{flex:1}
.loading{display:flex;align-items:center;gap:10px;padding:16px;color:var(--muted)}
.linkbtn{color:var(--acc-t);font-weight:600;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--s1);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}
.pend{color:var(--warn)!important}
.pill.k-zukauf{background:color-mix(in srgb,#1560BD 14%,transparent);color:color-mix(in srgb,#1560BD 70%,var(--text))}
.pill.k-norm{background:color-mix(in srgb,#5A4FCF 14%,transparent);color:color-mix(in srgb,#5A4FCF 70%,var(--text))}
.pill.k-eigen{background:color-mix(in srgb,#2F5D3A 16%,transparent);color:var(--acc-t)}
.btree .brow{display:flex;align-items:stretch;border-top:1px solid var(--border);padding-left:calc(var(--d,0) * 14px)}
.btree .brow:first-child{border-top:0}
.btree .brow.asm{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.btree .brow.asm .t{font-weight:700}
.btree .brow.nop,.row.nop{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.btog{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.btog svg{transition:transform .15s}
.btog.open svg{transform:rotate(90deg)}
.bmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 2px;text-align:left}
.bmain:active{background:var(--s2)}
.bmain .main{flex:1;min-width:0}
.bmain .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmain .m{font-size:13px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.bmain .r{text-align:right;flex:none}
.bmain .r .num{display:block;font-size:14px}
.bmain .r small{display:block;font-size:12px;color:var(--muted)}
.bpos{font-size:12px;color:var(--acc-t);margin-right:6px;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bar" id="bar"></div>
    <div class="st busy" id="st"><span class="spin"></span><span class="tx">Wird geladen …</span></div>
  </div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" hidden></button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>

<script>
(function(){
"use strict";
// ═════════════════════════ Grundlagen ═════════════════════════
const DRIVE="Google Drive", ORDNER="Vanta Mobil", PC_DATEI="vanta_pc.json";
const CACHE="vanta_mobil_v2";
const STATUS=["anfrage","aktiv","pausiert","abgeschlossen","abgebrochen"];
const STATUS_TXT={anfrage:"Anfrage",aktiv:"Aktiv",pausiert:"Pausiert",abgeschlossen:"Abgeschlossen",abgebrochen:"Abgebrochen",laufend:"Aktiv"};
const KIDS={kunde:["projekte","projekt"],projekt:["tasks","task"],task:["zeiteintraege","zeit"]};
const PKEY={projekt:"projekte",task:"tasks",zeit:"zeiteintraege"};
const FELDER={kunde:["name","stundensatz","anschrift","email","uid","zahlungsziel"],
  projekt:["name","nummer","status","abrechnungstyp","pauschalpreis","stundensatz","beschreibung","eigenprojekt","abbruch"],
  task:["name","status"],zeit:["datum","von","bis","pause_min","stunden","kommentar"]};
const MON=["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONK=["Jän","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

const ICON={
  haus:'<path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/>',
  ordner:'<path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/>',
  zeit:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  umsatz:'<path d="M3 20h18"/><path d="M6 16v-3"/><path d="M10 16v-6"/><path d="M14 16v-4"/><path d="M18 16V6"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.9-3.9L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.9L20 15"/><path d="M20 20v-5h-5"/>',
  back:'<path d="M15 6l-6 6 6 6"/>', chev:'<path d="M9 6l6 6-6 6"/>',
  suchen:'<circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>', stift:'<path d="M4 20h4L19 9l-4-4L4 16v4"/><path d="M13.5 6.5l4 4"/>',

function walk(kunden,fn){(kunden||[]).forEach(k=>{if(!k)return;fn("kunde",k,null);(k.projekte||[]).forEach(p=>{fn("projekt",p,k);(p.tasks||[]).forEach(t=>{fn("task",t,p);(t.zeiteintraege||[]).forEach(z=>fn("zeit",z,t))})})})}

function cacheSpeichern(){try{localStorage.setItem(CACHE,JSON.stringify({pc:PC,h:H,unsaved:UNSAVED,meta:META}))}catch(e){}}

function aufbauen(){
  const s=stand(), alias=(PC&&PC.alias)||{};
  const kunden=clone((PC&&PC.kunden)||[]);
  const idx=new Map(); walk(kunden,(typ,o,par)=>{if(o.id!=null)idx.set(String(o.id),{typ,o,par})});
  PCIDS=new Set(idx.keys());
  const res=id=>{let i=String(id),n=0;while(alias[i]&&n<10){i=String(alias[i]);n++}return i};
  const pcDel=new Set(((PC&&PC.geloescht)||[]).map(g=>String(g.id)));
  if(H&&Array.isArray(H.kunden)){
    const go=(typ,e,parV)=>{
      if(!e||e.id==null)return;
      const id=res(e.id), pend=String(e._gh||"")>s;
      let ent=idx.get(id), v=ent&&ent.typ===typ?ent.o:null;
      if(pend){
        if(v){FELDER[typ].forEach(f=>{if(f in e)v[f]=clone(e[f])});v._gh=e._gh;if(e._ghf)v._ghf=clone(e._ghf)}
        else if(!pcDel.has(id)&&(typ==="kunde"||parV)){
          v={};Object.keys(e).forEach(k=>{if(!KIDS[typ]||k!==KIDS[typ][0])v[k]=clone(e[k])});
          if(KIDS[typ])v[KIDS[typ][0]]=[];
          (typ==="kunde"?kunden:(parV[PKEY[typ]]=parV[PKEY[typ]]||[])).push(v);
          idx.set(id,{typ,o:v,par:parV});
        }
      }
      if(v&&KIDS[typ])(e[KIDS[typ][0]]||[]).forEach(x=>go(KIDS[typ][1],x,v));
    };
    H.kunden.forEach(k=>go("kunde",k,null));
    (H.geloescht||[]).forEach(g=>{if(String(g.zeit||"")<=s)return;const e=idx.get(res(g.id));if(!e||!e.par)return;
      const key=PKEY[e.typ];e.par[key]=(e.par[key]||[]).filter(x=>x!==e.o);idx.delete(res(g.id))});
  }
  V={kunden};
}
function ausstehend(){
  const s=stand(), out=[];
  walk(V.kunden,(typ,o)=>{if(String(o._gh||"")>s)out.push({typ,o})});
  ((H&&H.geloescht)||[]).forEach(g=>{if(String(g.zeit||"")>s)out.push({typ:g.typ,del:true,o:g})});
  return out;
}

// ── Google-Anmeldung (Google Identity Services, nur im Browser) ──
const SCOPE="https://www.googleapis.com/auth/drive";
const TOKEN_KEY="vanta_token", CID_KEY="vanta_client_id";
let TOKEN=null, TOKEN_CLIENT=null, GIS_LADEN=null;
function clientId(){try{return (window.VANTA_CONFIG&&window.VANTA_CONFIG.clientId)||localStorage.getItem(CID_KEY)||""}catch(e){return (window.VANTA_CONFIG&&window.VANTA_CONFIG.clientId)||""}}
function tokenLaden(){try{const t=JSON.parse(localStorage.getItem(TOKEN_KEY)||"null");if(t&&t.exp>Date.now()+60000)TOKEN=t}catch(e){}}
function tokenSpeichern(){try{TOKEN?localStorage.setItem(TOKEN_KEY,JSON.stringify(TOKEN)):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
const driveBereit=()=>!!(TOKEN&&TOKEN.exp>Date.now()+30000);
function gisLaden(){
  if(GIS_LADEN)return GIS_LADEN;
  GIS_LADEN=new Promise((ok,nein)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
    const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
    sc.onload=()=>ok();sc.onerror=()=>{GIS_LADEN=null;nein({code:"offline",message:"Google-Anmeldung nicht erreichbar"})};
    document.head.appendChild(sc);
  });
  return GIS_LADEN;
}
async function anmelden(){
  const cid=clientId(); if(!cid)throw {code:"setup"};
  await gisLaden();
  return new Promise((ok,nein)=>{
    TOKEN_CLIENT=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPE,
      callback:r=>{if(r&&r.access_token){TOKEN={access_token:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000};tokenSpeichern();ok(TOKEN)}else nein({code:"auth",message:(r&&r.error)||"abgebrochen"})},
      error_callback:e=>nein({code:"auth",message:(e&&(e.message||e.type))||"abgebrochen"})});
    try{TOKEN_CLIENT.requestAccessToken({prompt:""})}catch(e){nein({code:"auth",message:String(e)})}
  });
}
function abmelden(){
  try{if(TOKEN&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(TOKEN.access_token,()=>{})}catch(e){}
  TOKEN=null;tokenSpeichern();status("warn",FEHLER.auth,{t:"Anmelden",f:anmeldenUndAbgleichen});render();
}
async function anmeldenUndAbgleichen(){

}
function zeigeFehler(e,nochmal){
  if(e&&e.code==="setup")status("warn",FEHLER.setup,{t:"Einrichten",f:einrichtenForm});
  else if(e&&e.code==="auth"){TOKEN=null;tokenSpeichern();status("warn",FEHLER.auth,{t:"Anmelden",f:anmeldenUndAbgleichen})}

// ── Drive REST ──
const API="https://www.googleapis.com/drive/v3", UPL="https://www.googleapis.com/upload/drive/v3";
async function api(url,opt){
  if(!driveBereit())throw {code:"auth"};
  let r;
  try{r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+TOKEN.access_token},(opt&&opt.headers)||{})}))}
  catch(e){throw {code:"offline",message:String(e)}}
  if(r.status===401)throw {code:"auth"};
  if(!r.ok){const t=await r.text().catch(()=>"");throw {code:r.status===403?"http403":r.status===404?"http404":"http",message:r.status+" "+t.slice(0,160)}}
  return r;
}
const q=s=>encodeURIComponent(s);
// Gleiche Schnittstelle wie vorher (Werkzeugnamen des Claude-Connectors),
// damit der Rest der App unverändert bleibt.
async function call(tool,input){
  if(tool==="search_files"){
    let qq=String(input.query).replace(/\btitle =/g,"name =").replace(/parentId = '([^']+)'/g,"'$1' in parents");
    const r=await api(`${API}/files?q=${q(qq)}&fields=${q("files(id,name,mimeType,modifiedTime)")}&pageSize=${input.pageSize||100}&spaces=drive`);
    const j=await r.json();
    return {files:(j.files||[]).map(f=>({id:f.id,title:f.name,mimeType:f.mimeType,modifiedTime:f.modifiedTime}))};
  }
  if(tool==="download_file_content"){
    const r=await api(`${API}/files/${input.fileId}?alt=media`);
    return {text:await r.text()};
  }
  if(tool==="create_file"){
    const meta={name:input.title,parents:[input.parentId],mimeType:"application/json"};
    const grenze="vanta"+Math.random().toString(36).slice(2);
    const body=`--${grenze}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${grenze}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${input.textContent}\r\n--${grenze}--`;
    const r=await api(`${UPL}/files?uploadType=multipart&fields=id,name`,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+grenze},body});
    const j=await r.json();return {id:j.id,title:j.name};
  }
  if(tool==="trash_file"){
    await api(`${API}/files/${input.fileId}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})});
    return {};
  }
  throw {code:"http",message:"unbekannt: "+tool};
}
async function ordnerFinden(){
  if(META.folderId)return META.folderId;
  const r=await call("search_files",{query:`title = '${ORDNER}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,pageSize:10});
  const f=((r&&r.files)||[]).sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0];
  if(!f)return "";
  META.folderId=f.id;return f.id;
}
async function auflisten(){
  const fid=await ordnerFinden(); if(!fid)return null;
  let r;
  try{r=await call("search_files",{query:`parentId = '${fid}' and trashed = false`,pageSize:100})}
  catch(e){if(e&&e.code==="http404"){META.folderId="";return auflisten()}throw e}
  const files=(r&&r.files)||[];
  const pc=files.filter(f=>f.title===PC_DATEI).sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0]||null;
  const handy=files.filter(f=>/^handy_\d{8,}.*\.json$/i.test(f.title||"")&&!/\(/.test(f.title)).sort((a,b)=>String(b.title).localeCompare(String(a.title)));
  return {pc,handy};
}
async function laden(id){
  const r=await call("download_file_content",{fileId:id});
  return JSON.parse(String(r.text||"").replace(/^﻿/,""));
}

let syncLaeuft=false;
async function abgleichen(still){
  if(syncLaeuft)return; syncLaeuft=true;
  if(!still)status("busy","Abgleich mit Google Drive …");
  try{
    if(!clientId())throw {code:"setup"};
    if(!driveBereit())throw {code:"auth"};
    const l=await auflisten();
    if(!l){status("warn","Ordner „Vanta Mobil“ fehlt — Vanta am PC einmal starten",{t:"Erneut",f:()=>abgleichen()});return}
    if(!l.pc){status("warn","Noch kein Stand vom PC — Vanta am PC starten",{t:"Erneut",f:()=>abgleichen()});return}
    if(l.pc.id!==META.pcFileId||l.pc.modifiedTime!==META.pcModified||!PC){
      PC=await laden(l.pc.id); META.pcFileId=l.pc.id; META.pcModified=l.pc.modifiedTime;
    }
    META.handyFiles=l.handy.map(f=>({id:f.id,title:f.title}));
    // Eigene Datei: jüngste auf Drive übernehmen, wenn hier nichts Ungespeichertes liegt
    const neueste=l.handy[0];
    if(neueste&&!UNSAVED&&(!H||String(neueste.title)>String(H.datei||""))){
      try{const h=await laden(neueste.id);if(h&&h.format==="vanta-mobil-handy"){H=h;H.datei=neueste.title}}catch(e){}
    }
    aufbauen(); cacheSpeichern();
    if(UNSAVED){await hochladen();return}
    statusAusDaten(); render();
  }catch(e){
    zeigeFehler(e,()=>abgleichen());
  }finally{syncLaeuft=false}
}

let ladeKette=Promise.resolve();
function speichern(){
  // Neuer Stand der eigenen Datei — lokal sofort, Drive gleich danach
  const geloescht=((H&&H.geloescht)||[]).filter(g=>String(g.zeit||"")>stand());
  H={format:"vanta-mobil-handy",version:2,hinweis:"Geschrieben von Vanta PDM Mobil. Bitte nicht von Hand ändern.",
     geaendert:nowIso(),pc_stand:String(PC&&PC.geaendert||""),datei:(H&&H.datei)||"",kunden:clone(V.kunden),geloescht};
  UNSAVED=true; cacheSpeichern(); render();
  ladeKette=ladeKette.then(hochladen,hochladen);
  return ladeKette;
}
async function hochladen(){
  if(!UNSAVED||!H)return;
  if(!driveBereit()){status("warn","Am Handy gespeichert — zum Hochladen anmelden",{t:"Anmelden",f:anmeldenUndAbgleichen});return}
  status("busy","Speichere auf Google Drive …");
  try{
    const fid=await ordnerFinden();
    if(!fid){status("warn","Ordner „Vanta Mobil“ fehlt — Vanta am PC einmal starten",{t:"Erneut",f:hochladen});return}
    const d=new Date(), name="handy_"+d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+p2(d.getUTCHours())+p2(d.getUTCMinutes())+p2(d.getUTCSeconds())+String(d.getUTCMilliseconds()).padStart(3,"0")+".json";
    const inhalt=Object.assign({},H,{datei:name});
    const r=await call("create_file",{title:name,parentId:fid,textContent:JSON.stringify(inhalt),contentMimeType:"application/json",disableConversionToGoogleType:true});
    const neuId=r&&r.id;
    H.datei=name; UNSAVED=false; cacheSpeichern();
    // ältere eigene Dateien in den Papierkorb (der PC liest ohnehin die jüngste)
    const alt=(META.handyFiles||[]).filter(f=>f.id!==neuId);
    META.handyFiles=neuId?[{id:neuId,title:name}]:[];
    for(const f of alt){try{await call("trash_file",{fileId:f.id})}catch(e){}}
    cacheSpeichern(); statusAusDaten(); render();
  }catch(e){
    if(e&&(e.code==="auth"||e.code==="setup"))zeigeFehler(e);
    else status("err","Nicht auf Drive gespeichert — "+fehlerText(e),{t:"Erneut speichern",f:()=>{ladeKette=ladeKette.then(hochladen,hochladen)}});
  }
}

// Alle 45 s (nur wenn sichtbar): neuer Stand vom PC?
async function nachschauen(){
  if(document.hidden||!driveBereit()||syncLaeuft||UNSAVED)return;
  try{
    const l=await auflisten(); if(!l||!l.pc)return;
    if(l.pc.modifiedTime!==META.pcModified){
      if(sheetOffen())status("down","Neuer Stand vom PC",{t:"Aktualisieren",f:()=>abgleichen()});
      else abgleichen(true);
    }
  }catch(e){}
}

function projHours(p){let h=0;(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>h+=nz(z.stunden)));return h}
function zaehlt(p){return !p.eigenprojekt&&!(String(p.status)==="abgebrochen"&&!(p.abbruch&&p.abbruch.verrechnen))}
function rate(p,k){return nz(p.stundensatz)||nz(k&&k.stundensatz)}
function projCalc(p,k){
  const h=projHours(p), c=p._calc||null, r=rate(p,k);
  let betrag;
  if(c&&c.betrag!=null){betrag=nz(c.betrag);if(p.abrechnungstyp!=="pauschal")betrag+= (h-nz(c.stunden))*r}
  else betrag=p.abrechnungstyp==="pauschal"?nz(p.pauschalpreis):h*r;
  const bezahlt=(p.zahlungen||[]).reduce((a,z)=>a+nz(z.betrag),0);
  const z=zaehlt(p);
  return {h,betrag,bezahlt,offen:z?Math.max(0,betrag-bezahlt):0,zaehlt:z,rate:r};
}
const aktiv=s=>s==="aktiv"||s==="laufend";
function lastDate(p){let d=0;(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>{const x=pd(z.datum);if(x&&+x>d)d=+x}));return d||(pd(p.erstellt)?+pd(p.erstellt):0)}
function allEntries(){const out=[];V.kunden.forEach(k=>(k.projekte||[]).forEach(p=>(p.tasks||[]).forEach(t=>(t.zeiteintraege||[]).forEach(z=>{const d=pd(z.datum);if(d)out.push({z,t,p,k,d})}))));
  return out.sort((a,b)=>b.d-a.d||String(b.z.von).localeCompare(String(a.z.von)))}
function allPayments(){const out=[];V.kunden.forEach(k=>(k.projekte||[]).forEach(p=>{if(p.eigenprojekt)return;(p.zahlungen||[]).forEach(z=>{const d=pd(z.datum);if(d)out.push({z,p,k,d})})}));return out.sort((a,b)=>b.d-a.d)}

function aendern(o,typ,neu){
  const vonPc=PCIDS.has(String(o.id));
  if(!offen(o))o._ghf={};
  if(vonPc)o._ghf=o._ghf||{};
  let geaendert=false;
  for(const [f,w] of Object.entries(neu)){
    if(JSON.stringify(o[f]??"")===JSON.stringify(w??""))continue;
    if(vonPc&&!(f in o._ghf))o._ghf[f]=clone(o[f]??"");
    o[f]=w;geaendert=true;
  }
  if(!vonPc)delete o._ghf;
  if(geaendert)o._gh=nowIso();
  return geaendert;
}
function loeschen(typ,o,eltern){
  const key=PKEY[typ];eltern[key]=(eltern[key]||[]).filter(x=>x!==o);
  if(PCIDS.has(String(o.id))){H=H||{kunden:[],geloescht:[]};H.geloescht=(H.geloescht||[]).concat([{id:o.id,typ,zeit:nowIso()}])}
}
function naechsteNummer(k){
  const nrs=(k&&k.projekte||[]).map(p=>String(p.nummer||"")).filter(Boolean);
  const m=nrs.map(n=>/^(.*?)(\d+)$/.exec(n)).filter(Boolean);
  if(!m.length)return "";
  const zaehl={};m.forEach(x=>zaehl[x[1]]=(zaehl[x[1]]||0)+1);
  const pre=Object.entries(zaehl).sort((a,b)=>b[1]-a[1])[0][0];
  const passend=m.filter(x=>x[1]===pre);const w=Math.max(...passend.map(x=>x[2].length));
  const alle=new Set();V.kunden.forEach(kk=>(kk.projekte||[]).forEach(p=>alle.add(normNr(p.nummer))));
  let n=Math.max(...passend.map(x=>+x[2]));let c;do{n++;c=pre+String(n).padStart(w,"0")}while(alle.has(normNr(c)));return c;
}

// Zeigt die Projektordner so, wie sie in Google Drive liegen. Pfade aus Vanta
// („H:/Meine Ablage/…“) werden Ordner für Ordner in Drive-IDs übersetzt.
const FOLDER="application/vnd.google-apps.folder", SHORTCUT="application/vnd.google-apps.shortcut";
const LISTE={}, PFADID={}, LADE={};
const qEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function drivePfad(pfad){
  const n=String(pfad||"").replace(/\\/g,"/").replace(/\/+$/,"");
  const m=/^[A-Za-z]:\/(?:Meine Ablage|My Drive)(?:\/(.*))?$/i.exec(n);
  return m?(m[1]||"").split("/").filter(Boolean):null;
}
async function pfadAufloesen(pfad){
  if(PFADID[pfad]!==undefined)return PFADID[pfad];
  const teile=drivePfad(pfad); if(!teile)return null;
  let id="root";
  for(const t of teile){
    const r=await api(`${API}/files?q=${q(`name = '${qEsc(t)}' and '${id}' in parents and trashed = false and (mimeType = '${FOLDER}' or mimeType = '${SHORTCUT}')`)}&fields=${q("files(id,mimeType,shortcutDetails)")}&pageSize=5&spaces=drive`);
    const j=await r.json(); const f=(j.files||[])[0];
    if(!f){PFADID[pfad]=false;return false}
    id=f.mimeType===SHORTCUT?(f.shortcutDetails&&f.shortcutDetails.targetId)||f.id:f.id;
  }
  PFADID[pfad]=id; return id;
}
async function ordnerLaden(fid){
  let alle=[],token="";
  do{
    const r=await api(`${API}/files?q=${q(`'${fid}' in parents and trashed = false`)}&fields=${q("nextPageToken,files(id,name,mimeType,modifiedTime,size,webViewLink,shortcutDetails)")}&orderBy=${q("folder,name_natural")}&pageSize=200&spaces=drive${token?"&pageToken="+q(token):""}`);
    const j=await r.json(); alle=alle.concat(j.files||[]); token=j.nextPageToken||"";
  }while(token&&alle.length<2000);
  LISTE[fid]=alle.map(f=>{
    if(f.mimeType===SHORTCUT&&f.shortcutDetails){return Object.assign({},f,{id:f.shortcutDetails.targetId,mimeType:f.shortcutDetails.targetMimeType||f.mimeType})}
    return f;
  }).sort((a,b)=>((b.mimeType===FOLDER)-(a.mimeType===FOLDER))||String(a.name).localeCompare(String(b.name),"de",{numeric:true}));
  return LISTE[fid];
}
function dateiArt(f){
  if(f.mimeType===FOLDER)return "ordner";
  const n=String(f.name||"").toLowerCase();
  if(f.mimeType==="application/pdf"||n.endsWith(".pdf"))return "pdf";
  if(/^image\//.test(f.mimeType||"")||/\.(png|jpe?g|gif|webp|bmp)$/.test(n))return "bild";
  if(/\.(step|stp|igs|iges|stl|z3prt|z3asm|z3drw|ipt|iam|idw|sldprt|sldasm|slddrw|dxf|dwg|x_t)$/.test(n))return "cad";
  if(/\.(xlsx?|csv|ods)$/.test(n)||/spreadsheet/.test(f.mimeType||""))return "tabelle";
  return "datei";
}
const ARTICON={ordner:"ordner",pdf:"pdf",bild:"bild",cad:"cad",tabelle:"tabelle",datei:"datei"};
function groesse(b){b=+b||0;if(!b)return "";if(b<1024)return b+" B";if(b<1048576)return Math.round(b/1024)+" KB";return (b/1048576).toLocaleString("de-AT",{maximumFractionDigits:1})+" MB"}
function datum(iso){const d=new Date(iso);return isNaN(d)?"":`${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`}
const driveLink=f=>f.webViewLink||(f.mimeType===FOLDER?`https://drive.google.com/drive/folders/${f.id}`:`https://drive.google.com/file/d/${f.id}/view`);

function dateiZeile(f){
  const art=dateiArt(f), info=[art==="ordner"?"":groesse(f.size),datum(f.modifiedTime)].filter(Boolean).join(" · ");
  const inner=`<span class="ftyp ${art}">${ic(ARTICON[art],"s")}</span><div class="main"><div class="t" style="white-space:normal;overflow-wrap:anywhere">${esc(f.name)}</div><div class="m">${esc(info)}</div></div>`;
  if(art==="ordner")return `<button class="row" data-act="ordner" data-fid="${esc(f.id)}" data-titel="${esc(f.name)}">${inner}${ic("chev","s chev")}</button>`;

}

}

const PDFJS_VER="3.11.174";
let PDFJS=null;
function pdfjsLaden(){
  if(PDFJS)return PDFJS;
  PDFJS=new Promise((ok,nein)=>{
    const sc=document.createElement("script");
    sc.src=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`;
    sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;ok(window.pdfjsLib)}catch(e){nein(e)}};
    sc.onerror=()=>{PDFJS=null;nein({code:"offline",message:"PDF-Anzeige konnte nicht geladen werden"})};
    document.head.appendChild(sc);
  });
  return PDFJS;
}
const PDFDOC={};
async function pdfLaden(fid){
  const lib=await pdfjsLaden();
  const r=await api(`${API}/files/${fid}?alt=media`);
  const daten=new Uint8Array(await r.arrayBuffer());
  PDFDOC[fid]=await lib.getDocument({data:daten}).promise;

}
function vPdf(s){

    <p class="note">Mit + / − zoomen, dann im Bild verschieben. Querformat drehen zeigt mehr.</p>`;

let PDF_LAUF=0;
async function pdfZeichnen(s){
  const doc=PDFDOC[s.fid], box=document.getElementById("pv"); if(!doc||!box)return;
  const lauf=++PDF_LAUF; box.innerHTML="";
  const breite=Math.max(200,box.clientWidth-16), dpr=Math.min(window.devicePixelRatio||1,3);
  for(let i=1;i<=doc.numPages;i++){
    if(lauf!==PDF_LAUF)return;
    const seite=await doc.getPage(i), vp0=seite.getViewport({scale:1});
    const css=breite*s.zoom/vp0.width, vp=seite.getViewport({scale:css*dpr});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    c.style.width=Math.floor(vp.width/dpr)+"px"; c.style.height=Math.floor(vp.height/dpr)+"px";
    box.appendChild(c);
    try{await seite.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}catch(e){}
  }
}

function zahlWert(t,v=0){let s=String(t??'').trim();if(!s)return v;s=s.replace(/[^0-9,.\-]/g,'');if(!s)return v;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');

function preisWert(t){let s=String(t??'').trim();if(!s)return 0;s=s.replace(/€|EUR|eur|\s/g,'');

const bProp=(p,k)=>String((p.props||{})[k]??'').trim();
const bEinheit=p=>bProp(p,'Einheit')||'Stk';
const bMeter=p=>!['','stk','stück','stueck','stk.','st'].includes(bEinheit(p).toLowerCase());
function bMassEigen(p){const w=zahlWert(bProp(p,'Länge'),0);return w>0?w:zahlWert(bProp(p,'Maß'),0)}
function bMassAuto(p){
  if(!bMeter(p))return 0;const e=bEinheit(p).toLowerCase();
  if(e==='kg')return +p.auto_kg||0;
  const f={m:100,cm:1,mm:0.1}[e];if(!f)return 0;
  const cm=+p.auto_cm||0;return cm>0?Math.round(cm/f*1e4)/1e4:0;
}
function bMassJe(p){if(!bMeter(p))return 1;const w=bMassEigen(p);if(w>0)return w;const a=bMassAuto(p);return a>0?a:1}
const bMassFehlt=p=>bMeter(p)&&bMassEigen(p)<=0&&bMassAuto(p)<=0;
function bMassQuelle(p){if(bMassEigen(p)>0||bMassAuto(p)<=0)return '';return bEinheit(p).toLowerCase()==='kg'?'Masse':(p.auto_quelle||'Parameter')}
const bMenge=p=>(p.qty_total||1)*bMassJe(p);
function fmtMenge(v){const f=+v||0;if(Math.abs(f-Math.round(f))<0.0005)return String(Math.round(f));return f.toFixed(3).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')}
const bMengeText=p=>fmtMenge(bMenge(p))+(bMeter(p)?' '+bEinheit(p):' Stk');
const bPreis=p=>preisWert(bProp(p,'Preis'));
function bKat(p){
  if(p.is_asm)return 'bg';
  const a=bProp(p,'Art').toLowerCase();
  if(/^(zukauf|kaufteil|zt)/.test(a))return 'zukauf';
  if(/^(norm|nt)/.test(a))return 'norm';
  return a?'eigen':'';
}
const bSelbst=(p,besch)=>p.is_asm?false:(p.selbst!=null?!!p.selbst:besch==='selbst');
function lzTage(text){ // project_cad: Zahl ohne Einheit = Tage
  const s=String(text||'').trim().toLowerCase();if(!s)return null;
  const z=s.match(/\d+(?:[.,]\d+)?/g);if(!z)return null;
  const w=Math.max(...z.map(x=>parseFloat(x.replace(',','.'))));
  for(const [ws,f] of [[['woche','wochen','wo','wk'],7],[['monat','monate','mon'],30],[['tag','tage','td','at','werktage','werktag'],1]])
    for(const x of ws)if(new RegExp('\\b'+x).test(s))return w*f;
  return w;
}
function lzTageBL(text){ // bestellliste: Zahl ohne Einheit = Wochen
  const s=String(text||'').trim().toLowerCase();if(!s)return 0;
  const z=s.match(/\d+(?:[.,]\d+)?/g);if(!z)return 0;
  const w=Math.max(...z.map(x=>parseFloat(x.replace(',','.'))));
  for(const [ws,f] of [[['woche','wochen','w','wo','kw'],7],[['tag','tage','t','d','werktage','arbeitstage'],1],[['monat','monate','m','mon'],30]])
    for(const x of ws)if(new RegExp('\\b'+x+'\\b').test(s))return Math.round(w*f);
  return Math.round(w*7);
}
function lzText(t){if(t<=0)return 'unbekannt';if(t%7===0&&t>=7){const w=t/7;return w+' Woche'+(w!==1?'n':'')}return t+' Tag'+(t!==1?'e':'')}
function bomKennzahlen(d){
  const o={positionen:0,teile:0,baugruppen:0,zukauf:0,norm:0,eigen:0,materialwert:0,auslagen:0,ohne_preis:0,selbst_positionen:0,lz:null,lzText:''};
  if(!d)return o;
  d.positionen.forEach(p=>{
    o.positionen++;
    if(p.is_asm){o.baugruppen++;o.materialwert+=preisWert(bProp(p,'Fertigungskosten'))*bMenge(p);return}
    o.teile++;
    const k=bKat(p);if(k)o[k]++;
    const pr=bPreis(p),m=bMenge(p);
    if(pr<=0)o.ohne_preis++;
    o.materialwert+=pr*m;
    if(bSelbst(p,d.beschaffung)){o.selbst_positionen++;o.auslagen+=pr*m}
    const t=lzTage(bProp(p,'Lieferzeit'));
    if(t!=null&&(o.lz==null||t>o.lz)){o.lz=t;o.lzText=bProp(p,'Lieferzeit')}
  });
  o.materialwert=Math.round(o.materialwert*100)/100;o.auslagen=Math.round(o.auslagen*100)/100;
  return o;
}
const bEltern=pos=>pos.includes('.')?pos.slice(0,pos.lastIndexOf('.')):'';
function bZwischen(d){ // Preis je Baugruppe (1 Stück) = eigene Kosten + Teile × Menge
  const kinder={};d.positionen.forEach(p=>(kinder[bEltern(p.pos)]=kinder[bEltern(p.pos)]||[]).push(p));
  const out={};
  const sum=(p,t)=>{if(!p.is_asm)return bPreis(p)*bMassJe(p);if(t>12)return 0;
    let s=preisWert(bProp(p,'Fertigungskosten'));(kinder[p.pos]||[]).forEach(k=>s+=sum(k,t+1)*k.qty);out[p.pos]=s;return s};
  d.positionen.forEach(p=>{if(p.is_asm)sum(p,0)});
  return out;
}
const EIGEN_W=['eigen','dreh','fräs','fraes','blech','schweiß','schweiss','laser','kant','3d','druckteil'];
function bIstEigen(p){const a=bProp(p,'Art').toLowerCase();return EIGEN_W.some(w=>a.includes(w))}
function bomGruppen(d){ // wie bestellliste.gruppieren (Baumenge 1)
  const nach={},gleich={};
  d.positionen.forEach((p,i)=>{
    if(p.is_asm)return;
    if(!bProp(p,'Lieferant')&&bIstEigen(p))return;
    const lf=bProp(p,'Lieferant')||'Ohne Lieferant';
    const key=lf+'|'+(p.pfad||p.filename).toLowerCase();
    const menge=bMenge(p);
    if(gleich[key]){gleich[key].menge+=menge;if(p.pos)gleich[key].pos+=', '+p.pos;return}
    const ve=zahlWert(bProp(p,'VE'),0);
    const e={i,datei:p.filename,stem:p.stem,beschreibung:bProp(p,'Beschreibung'),bestellnummer:bProp(p,'Bestellnummer'),menge,
      einheit:bMeter(p)?bEinheit(p):'Stk',preis:bPreis(p),ve:ve>0?ve:0,tage:lzTageBL(bProp(p,'Lieferzeit')),lieferzeit:bProp(p,'Lieferzeit'),pos:p.pos};
    gleich[key]=e;
    const g=nach[lf]=nach[lf]||{lieferant:lf,positionen:[],summe:0,reste:0,tage:0,unvollstaendig:0};
    g.positionen.push(e);g.tage=Math.max(g.tage,e.tage);
  });
  const gs=Object.values(nach);
  gs.forEach(g=>{
    g.positionen.forEach(e=>{
      if(e.ve>1&&e.menge>0){e.packungen=Math.ceil(e.menge/e.ve-1e-9);e.rest=Math.round((e.packungen*e.ve-e.menge)*1000)/1000;e.packpreis=e.preis*e.ve;e.kosten=e.packungen*e.packpreis}
      else{e.packungen=0;e.rest=0;e.packpreis=0;e.kosten=e.preis*e.menge}
      g.summe+=e.kosten;g.reste+=e.kosten-e.preis*e.menge;
      if(e.preis<=0||e.menge<=0||!e.bestellnummer)g.unvollstaendig++;
    });
    g.positionen.sort((a,b)=>(a.bestellnummer.toLowerCase()+'\u0000'+a.datei.toLowerCase()).localeCompare(b.bestellnummer.toLowerCase()+'\u0000'+b.datei.toLowerCase()));
  });
  gs.sort((a,b)=>((a.lieferant==='Ohne Lieferant')-(b.lieferant==='Ohne Lieferant'))||(b.tage-a.tage)||a.lieferant.toLowerCase().localeCompare(b.lieferant.toLowerCase()));
  return gs;
}
const baseName=s=>String(s||'').split(/[\\/]/).pop();
const KATTXT={zukauf:'Zukauf',norm:'Norm',eigen:'Eigen',bg:'Baugruppe'};

const BOM={}, BOMUI={};           // BOM[pid] = {data|null, mt}
let BOMDIR=null;                  // {t, files:{name:{id,mt}}}
const bomName=pid=>(String(pid||"unbekannt").replace(/[^A-Za-z0-9_.-]/g,"_").slice(0,64)||"unbekannt")+".json";
function bomNorm(d,pid){
  if(!d||typeof d!=="object")return null;
  const out={projekt_id:d.projekt_id||pid,baugruppe:String(d.baugruppe||""),gelesen_am:String(d.gelesen_am||""),
    beschaffung:d.beschaffung==="selbst"?"selbst":"kunde",positionen:[]};
  (Array.isArray(d.positionen)?d.positionen:[]).forEach(p=>{
    if(!p||typeof p!=="object")return;
    const props={};Object.entries(p.props&&typeof p.props==="object"?p.props:{}).forEach(([k,v])=>props[k]=v==null?"":String(v));
    const fn=String(p.filename||""),num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:null};
    out.positionen.push({pos:String(p.pos??""),filename:fn,pfad:String(p.pfad||""),stem:String(p.stem||fn.replace(/\.[^.]*$/,"")),
      is_asm:!!p.is_asm,qty:parseInt(p.qty)||1,qty_total:parseInt(p.qty_total??p.qty)||1,props,
      auto_cm:num(p.auto_cm),auto_kg:num(p.auto_kg),auto_quelle:String(p.auto_quelle||""),
      selbst:p.selbst===true||p.selbst===false?p.selbst:null});
  });
  return out;
}
async function bomListe(neu){
  if(BOMDIR&&!neu&&Date.now()-BOMDIR.t<120000)return BOMDIR;
  const vm=await ordnerFinden(); const files={};
  if(vm){
    const top=await ordnerLaden(vm);
    const st=top.find(f=>f.mimeType===FOLDER&&f.name==="stueckliste");
    if(st)(await ordnerLaden(st.id)).forEach(f=>{if(/\.json$/i.test(f.name))files[f.name]={id:f.id,mt:f.modifiedTime||""}});
  }
  BOMDIR={t:Date.now(),files};return BOMDIR;
}
async function bomHolen(pid,neu){
  const dir=await bomListe(neu);
  const e=dir.files[bomName(pid)];
  if(!e){BOM[pid]={data:null,mt:""};return BOM[pid]}
  if(BOM[pid]&&BOM[pid].mt===e.mt&&!neu)return BOM[pid];
  const r=await api(`${API}/files/${e.id}?alt=media`);
  BOM[pid]={data:bomNorm(JSON.parse((await r.text()).replace(/^﻿/,"")),pid),mt:e.mt};
  return BOM[pid];
}

    <p class="note">Längste Lieferzeit: ${kz.lz!=null?esc(kz.lzText||Math.round(kz.lz)+" Tage"):"—"} · Material: ${d.beschaffung==="selbst"?"ich beschaffe":"der Kunde beschafft"}</p>

function bomUi(pid){if(!BOMUI[pid])BOMUI[pid]={mode:"baum",filter:"alle",q:"",zu:new Set()};return BOMUI[pid]}

          const nr=e.bestellnummer||"";

    <div class="list btree">${zeilen||'<div class="empty">Keine Positionen.</div>'}</div>

    <p class="note">Materialwert = Stückpreis × Gesamtmenge aller Einzelteile (+ Fertigungskosten der Baugruppen). Baugruppen zeigen die Summe ihrer Teile je Stück (Σ).</p>`;
}
const PROP_ORDER=["Beschreibung","Art","Bauteilnummer","Bestellnummer","Hersteller","Herstellernummer","Lieferant","Lieferzeit","Material","Oberfläche","Oberflächenbehandlung","Fertigung","Baureihe","Hauptmaß","Einheit","Länge","Maß","VE","Packungspreis","Preis","Fertigungskosten"];
// Wie fertigung.zeichnung_finden: PDF „<stem>.pdf“, sonst die neueste, die mit dem Stamm beginnt.
// Gesucht wird im Projektordner und zwei Ebenen darunter.
async function zeichnungFinden(p,stem){
  if(!p.ordner||!drivePfad(p.ordner))return {zustand:"keinordner"};
  const fid=await pfadAufloesen(p.ordner); if(!fid)return {zustand:"keinordner"};
  const s=String(stem).toLowerCase();
  const wahl=l=>{const pdf=l.filter(f=>f.mimeType!==FOLDER&&/\.pdf$/i.test(f.name));
    return pdf.find(f=>f.name.toLowerCase()===s+".pdf")||pdf.filter(f=>f.name.toLowerCase().startsWith(s)).sort((a,b)=>String(b.modifiedTime||"").localeCompare(String(a.modifiedTime||"")))[0]||null};
  const top=LISTE[fid]||await ordnerLaden(fid);
  let f=wahl(top);if(f)return {zustand:"ok",f};
  for(const sub of top.filter(x=>x.mimeType===FOLDER).slice(0,20)){

  }
  return {zustand:"keine",stem};
}

  if(d.act==="task-status"){const {t}=findT(d.pid,d.tid);if(t){aendern(t,"task",{status:aktiv(String(t.status||"aktiv"))?"abgeschlossen":"aktiv"});speichern()}return}
  if(d.act==="kunde-neu"){kundeForm(null);return}
  if(d.act==="kunde-edit"){kundeForm(d.kid);return}
  if(d.act==="projekt-edit"){projektForm({pid:d.pid});return}
  if(d.act==="ordner"){if(b.disabled)return;go({v:"ordner",fid:d.fid||"",pfad:d.pfad||null,titel:d.titel||"",sub:d.sub||""});return}
  if(d.act==="pdf"){go({v:"pdf",fid:d.fid,titel:d.titel,link:d.link});return}
  if(d.act==="bild"){go({v:"bild",fid:d.fid,titel:d.titel,link:d.link});return}
  if(d.act==="suche"){go({v:"suche",text:""});return}
  if(d.act==="bom"){go({v:"bom",pid:d.pid});return}
  if(d.act==="teil"){go({v:"teil",pid:d.pid,i:+d.i});return}
  if(d.act==="bom-neu"){const s=stack[stack.length-1];BOMDIR=null;delete BOM[s.pid];render();return}
  if(d.act==="bom-auf"||d.act==="bom-zu"){const s=stack[stack.length-1],u=bomUi(s.pid);u.zu=new Set();if(d.act==="bom-zu")((BOM[s.pid]||{}).data||{positionen:[]}).positionen.forEach(x=>{if(x.is_asm)u.zu.add(x.pos)});render();return}
  if(d.bmode){const s=stack[stack.length-1];bomUi(s.pid).mode=d.bmode;render();return}
  if(d.bfilter){const s=stack[stack.length-1];bomUi(s.pid).filter=d.bfilter;render();return}
  if(d.btog!=null){const s=stack[stack.length-1],z=bomUi(s.pid).zu;z.has(d.btog)?z.delete(d.btog):z.add(d.btog);render();return}
  if(d.act==="zoom"){const s=stack[stack.length-1];s.zoom=Math.min(4,Math.max(0.5,(s.zoom||1)*(+d.d>0?1.4:1/1.4)));if(s.v==="pdf"){const z=document.getElementById("zt");if(z)z.textContent=Math.round(s.zoom*100)+" %";pdfZeichnen(s)}else render();return}
  if(d.act==="neu-laden"){const s=stack[stack.length-1];if(s.fid){delete LISTE[s.fid];delete PDFDOC[s.fid];delete BILD[s.fid]}if(s.v==="suche")s.erg=null;render();return}
  if(d.act==="pfad-neu"){const s=stack[stack.length-1];delete PFADID[s.pfad];render();return}
  if(d.jahr){umsatzJahr=+d.jahr;render();return}
  if(d.taskToggle){const k=d.taskToggle;openTasks.has(k)?openTasks.delete(k):openTasks.add(k);b.parentElement.classList.toggle("open");b.setAttribute("aria-expanded",openTasks.has(k));return}
  if(d.go){go({v:d.go,kid:d.kid,pid:d.pid})}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="zq"||ev.target.id==="kq"||ev.target.id==="bq"){
    if(ev.target.id==="zq")zeitQ=ev.target.value;else if(ev.target.id==="bq")bomUi(stack[stack.length-1].pid).q=ev.target.value;else kundenQ=ev.target.value;
    const id=ev.target.id,pos=ev.target.selectionStart;render();
    const el=document.getElementById(id);el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}
  }
});
